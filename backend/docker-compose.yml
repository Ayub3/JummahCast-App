# 

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jummahcast-backend
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/backend/uploads
      - ./data:/backend/data
    environment:
      NODE_ENV: development
      DB_DRIVER: sqlite
      BLOB_DRIVER: local
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
    restart: unless-stopped
